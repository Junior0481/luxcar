<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navegação principal" style="width: 100%; min-height: 100%; box-sizing: border-box; background: #0A0C0F; padding: 20px 14px; display: flex; flex-direction: column; gap: 24px; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: #E9ECF1">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div style="width: 34px; height: 34px; flex: none; border-radius: 8px; background: #FF7A2F; color: #170A02; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 15px">TC</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-weight: 600; font-size: 14px; color: #F2F4F7">Teste concessionária</span>
<span style="font-size: 12px; color: #8A93A1">Centro da loja</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6F7886; padding: 0 10px 6px">Operação</span>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.dashboard.bg}}; color: {{n.dashboard.fg}}; font-weight: {{n.dashboard.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.dashboard.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
Dashboard</a>
<a href="Estoque.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.estoque.bg}}; color: {{n.estoque.fg}}; font-weight: {{n.estoque.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.estoque.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5.2A2 2 0 0 1 6.9 6.5h10.2a2 2 0 0 1 1.9 1.3L21 13v4H3z"/><path d="M3 13h18M5.5 17v2M18.5 17v2"/></svg>
Estoque</a>
<a href="Leads.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.leads.bg}}; color: {{n.leads.fg}}; font-weight: {{n.leads.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.leads.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>
Leads</a>
<a href="Negociacoes.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.negociacoes.bg}}; color: {{n.negociacoes.fg}}; font-weight: {{n.negociacoes.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.negociacoes.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
Negociações</a>
<a href="Pagamentos.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.pagamentos.bg}}; color: {{n.pagamentos.fg}}; font-weight: {{n.pagamentos.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.pagamentos.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
Pagamentos</a>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6F7886; padding: 0 10px 6px">Gestão</span>
<a href="Relatorios.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.relatorios.bg}}; color: {{n.relatorios.fg}}; font-weight: {{n.relatorios.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.relatorios.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M8.5 16v-4M12.5 16V8M16.5 16v-6"/></svg>
Relatórios</a>
<a href="Equipe.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.equipe.bg}}; color: {{n.equipe.fg}}; font-weight: {{n.equipe.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.equipe.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
Equipe</a>
<a href="Configuracoes.dc.html" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 7px; text-decoration: none; background: {{n.configuracoes.bg}}; color: {{n.configuracoes.fg}}; font-weight: {{n.configuracoes.fw}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.configuracoes.ic}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
Configurações</a>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #1C2026; border-radius: 10px">
<div style="width: 32px; height: 32px; flex: none; border-radius: 50%; background: #232830; color: #C9CFD8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{initial}}</div>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<span style="font-weight: 600; font-size: 13px">{{userName}}</span>
<span style="font-size: 12px; color: #8A93A1">{{userRole}}</span>
</div>
<button aria-label="Opções da conta" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #8A93A1; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
</button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"dashboard","options":["dashboard","estoque","leads","negociacoes","pagamentos","relatorios","equipe","configuracoes"]},"accent":{"editor":"color","default":"#FF7A2F"},"userName":{"editor":"text","default":"jonathan"},"userRole":{"editor":"text","default":"Vendedor"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#FF7A2F';
const active = this.props.active ?? 'dashboard';
const keys = ['dashboard','estoque','leads','negociacoes','pagamentos','relatorios','equipe','configuracoes'];
const n = {};
keys.forEach(function (k) {
n[k] = k === active
? { bg: '#181C22', fg: '#FFFFFF', fw: 600, ic: accent }
: { bg: 'transparent', fg: '#A3ABB8', fw: 500, ic: 'currentColor' };
});
const userName = this.props.userName ?? 'jonathan';
return { accent: accent, n: n, userName: userName, userRole: this.props.userRole ?? 'Vendedor', initial: userName.charAt(0).toUpperCase() };
}
}
</script>
</body>
</html>
